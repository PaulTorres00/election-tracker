name: Update election data

on:
  schedule:
    # Every 6 hours. Cron is UTC. Tighten this closer to election day if you want.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" in the Actions tab on demand

permissions:
  contents: write   # needed so the workflow can commit the refreshed data files

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest data
        run: python scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "election-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --quiet --cached || git commit -m "Update race data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
